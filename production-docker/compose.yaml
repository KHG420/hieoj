# HnieOJ 容器栈 —— docker compose（2026-09-10）
# 架构：web(nginx+php8.1) + db(mariadb10.6 自建) + cache(memcached) + judge(judged, host 网络)
# judge 通过挂载 /var/run/docker.sock，用宿主 dockerd 拉起 hustoj:latest 判题沙箱
# 注意：web/judge/db/cache 镜像都由 ubuntu:22.04 自建（不走 Docker Hub，国内 registry 太慢）
# 2026-09-10 性能审计修订：
#   - web 启用 memcached（OJ_MEMCACHE=1 指向 cache 容器），cache 容器不再空转
#   - 页面缓存目录由 docker volume 改为 tmpfs（cache_start.php 未命中就写文件，落盘无必要）
#   - nginx/php 配置改为 bind mount 覆盖镜像内同名文件：改配置只需 up -d（秒级），不必重建镜像
name: hnieoj

x-common: &common
  restart: unless-stopped
  logging:
    driver: json-file
    options: { max-size: "20m", max-file: "3" }

services:
  db:
    <<: *common
    build:
      context: ./db
      dockerfile: Dockerfile
    image: hnieoj-db:2026.09
    container_name: hnieoj-db
    environment:
      DB_ROOT_PASSWORD: ${DB_ROOT_PASSWORD}
      DB_NAME: jol
      DB_USER: hustoj
      DB_PASS: ${DB_PASSWORD}
      DB_BUFFER_POOL: 4G
    volumes:
      - db-data:/var/lib/mysql
    ports:
      - "127.0.0.1:${DB_PORT}:3306"
    healthcheck:
      test: ["CMD-SHELL", "mariadb-admin --socket=/run/mysqld/mysqld.sock -uroot -p\"$${DB_ROOT_PASSWORD}\" ping"]
      interval: 10s
      timeout: 5s
      retries: 30
      start_period: 60s

  cache:
    <<: *common
    build:
      context: ./cache
      dockerfile: Dockerfile
    image: hnieoj-cache:2026.09
    container_name: hnieoj-cache
    ports:
      - "127.0.0.1:11212:11211"

  web:
    <<: *common
    build:
      context: .
      dockerfile: web/Dockerfile
    image: hnieoj-web:2026.09
    container_name: hnieoj-web
    # 并行阶段 web 连宿主 mariadb(3306)，避免与容器 db 数据分叉
    extra_hosts:
      - "host.docker.internal:host-gateway"
    depends_on:
      db:
        condition: service_healthy
    environment:
      DB_HOST: ${WEB_DB_HOST}
      DB_PORT: ${WEB_DB_PORT}
      DB_NAME: jol
      DB_USER: hustoj
      DB_PASS: ${DB_PASSWORD}
      # 性能审计：启用 memcached 共享缓存；回滚只需把 OJ_MEMCACHE 改成 "0"
      OJ_MEMCACHE: "0"
      OJ_MEMSERVER: "cache"
      OJ_MEMPORT: "11211"
    volumes:
      - /home/judge/src/web:/home/judge/src/web
      # 配置挂载（2026-09-10 改为目录挂载）
      # 原为单文件 bind mount：绑定的是 inode，用编辑器 / sed -i 改写会换 inode，
      # 容器仍持旧 inode，表现为「配置改了、nginx -t 通过、reload 报成功，却完全不生效」。
      # 目录挂载跟随路径，既根治该陷阱，也让 blocklist.map 这类动态文件即刻生效。
      - ./conf/nginx/nginx.conf:/etc/nginx/nginx.conf:ro
      - ./conf/nginx/conf.d:/etc/nginx/conf.d:ro
      - ./conf/nginx/snippets:/etc/nginx/snippets:ro
      - ./conf/php/99-oj.ini:/etc/php/8.1/fpm/conf.d/99-oj.ini:ro
      - ./conf/php/www.conf:/etc/php/8.1/fpm/pool.d/www.conf:ro
    # 页面缓存目录改 tmpfs：容器重启即失效，不影响正确性，省掉每次写盘
    tmpfs:
      - /tmp/hustoj_page_cache:size=256m,mode=1777
    ports:
      - "${WEB_PORT}:80"
    healthcheck:
      test: ["CMD", "curl", "-fsS", "http://127.0.0.1/robots.txt"]
      interval: 15s
      timeout: 5s
      retries: 5

  judge:
    <<: *common
    build:
      context: ./judge
      dockerfile: Dockerfile
    image: hnieoj-judge:2026.09
    container_name: hnieoj-judge
    network_mode: host
    privileged: true
    volumes:
      - /home/judge:/home/judge
      - /var/run/docker.sock:/var/run/docker.sock
      - /usr/bin/judged:/usr/bin/judged:ro
      - /usr/bin/judge_client:/usr/bin/judge_client:ro
      - /var/log/hustoj:/var/log/hustoj
      # 容器专用 etc（含 judge.conf + java0.policy；judge.pid 写这里，避免污染宿主 /home/judge/etc/judge.pid）
      - ./conf/etc:/home/judge/etc

# 注：原 page-cache 卷已改为 web 服务的 tmpfs 挂载（见上），此处不再声明
volumes:
  db-data:
