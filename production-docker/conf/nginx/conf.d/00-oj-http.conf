# ============================================================
# 判据三 $block_ip —— 动态封禁名单（自动发现的新爬虫）
#   由 scripts/crawler-guard.sh 按「枚举广度」行为分析写入，TTL 24h 自动解封。
#   不依赖任何预知名单，因此能覆盖未来出现的新爬虫。
#   文件后缀非 .conf，不会被 include conf.d/*.conf 自动加载，仅此处显式引用。
#   回滚开关：文件 /opt/hnieoj-docker/run/crawler-guard.disabled 存在即只观察不封禁。
# ============================================================
geo $block_ip {
    default 0;
    include /etc/nginx/conf.d/blocklist.map;
}

# UA 特征兜底：覆盖官方未公布网段的爬虫。SERankingBacklinksBot 是实测漏网者
# （今天以 200 抓走 30.4 MB，原先的名单里没有它）。
map $http_user_agent $oj_bad_ua {
    default 0;
    "~*(GPTBot|ClaudeBot|Claude-Web|anthropic-ai|Bytespider|SemrushBot|AhrefsBot|MJ12bot|DotBot|PetalBot|DataForSeoBot|Amazonbot|SERankingBacklinksBot|YisouSpider|libredtail-http)" 1;
}

# 爬虫请求不写 access_log：省磁盘 I/O，主日志回到正常体积。
# nginx 对「含变量的 access_log 路径」会拼接 prefix（曾踩坑：/dev/null 变成
# /usr/share/nginx//dev/null 并狂刷 crit）——正确做法是用 if= 参数条件关闭，而不是变量路径。
map $oj_bad_ip $oj_ip_ok { default 1; 1 0; }
map $oj_bad_ua $oj_ua_ok { default 1; 1 0; }
map $block_ip  $oj_blk_ok { default 1; 1 0; }
map "$oj_ip_ok$oj_ua_ok$oj_blk_ok" $oj_keep_log { default 1; "~0" 0; }

# 静态文件元数据缓存：webroot 是 bind mount，未开启时每个请求都要 stat 目录
open_file_cache max=10000 inactive=20s;
open_file_cache_valid 30s;
open_file_cache_min_uses 2;
open_file_cache_errors off;

# 动态页限流（按真实 IP 分桶）
# 注意：校园机房 NAT 后多个学生共用一个出口 IP 时会互相挤兑出 429，
# 若出现集中投诉请放宽 rate 或改为按 session 维度。
limit_req_zone $binary_remote_addr zone=oj_dyn:10m rate=8r/s;
limit_req_status 429;
