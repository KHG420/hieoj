#           由 /opt/hnieoj-docker/scripts/sync-aibot-ips.sh 定期同步，勿手工改段内内容。
#
#   判据二 $oj_bad_ua —— UA 特征兜底，覆盖尚未公布网段的爬虫。
#
#   命中任一即 444 断连：不返回响应体、不进 location 处理、不写日志。
#   注意 iptables/ipset 在本机对这类流量无效 —— 入口连接由 frpc 发起，
#   本机看到的对端恒为 127.0.0.1 / docker 网关，只能在 nginx 层或 frps 侧拦。
