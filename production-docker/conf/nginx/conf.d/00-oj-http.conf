# ==== 2026-09-10 容器化：http 级配置（镜像内 /etc/nginx/conf.d/ 会被 http{} 自动加载）====

# 真实客户端 IP 还原：外部流量经 frp 隧道进来，remote_addr 恒为隧道来源地址。
# 容器里还要信任 docker 网桥（frpc -> docker-proxy -> 容器，源地址是网关）。
set_real_ip_from 127.0.0.1;
set_real_ip_from 172.16.0.0/12;
set_real_ip_from 10.0.0.0/8;
set_real_ip_from 192.168.0.0/16;
real_ip_header X-Forwarded-For;
real_ip_recursive on;

# ============================================================
# 反爬（2026-09-10 重做）：AI 训练/抓取爬虫
#
#   判据一 $oj_bad_ip —— 官方公布的爬虫来源网段。这是治本判据：
#           UA 可以随便伪造，IP 段不能（实测 GPTBot 全部来自 74.7.241.25，
#           ClaudeBot 全部来自 216.73.216.251，均落在下列官方段内）。
#             OpenAI GPTBot : https://openai.com/gptbot.json
