name: hnieoj-unified
x-common: &common
  restart: unless-stopped
  logging:
    driver: json-file
    options: {max-size: "20m", max-file: "3"}
services:
  db:
    <<: *common
    build: {context: ., dockerfile: docker/db/Dockerfile}
    volumes:
      - db-data:/var/lib/mysql
      - credentials:/run/oj-secrets
    environment:
      DB_BUFFER_POOL: ${DB_BUFFER_POOL:-512M}
    healthcheck:
      test: ["CMD-SHELL", "test -f /var/lib/mysql/.oj-initialized && mariadb-admin --socket=/run/mysqld/mysqld.sock ping --silent"]
      interval: 5s
      timeout: 5s
      retries: 60
      start_period: 60s
  cache:
    <<: *common
    build: {context: docker/cache}
  web:
    <<: *common
    build: {context: ., dockerfile: docker/web/Dockerfile}
    depends_on:
      db: {condition: service_healthy}
    environment:
      DB_HOST: db
      DB_NAME: jol
      DB_USER: hustoj
      DB_PASS: ""
      OJ_MEMCACHE: "0"
      OJ_MEMSERVER: cache
      OJ_MEMPORT: "11211"
      # 注册验证码邮件（腾讯云 SES）：真实值只保存在服务器 .env，缺省为空即视为未配置
      TENCENTCLOUD_SECRET_ID: ${TENCENTCLOUD_SECRET_ID:-}
      TENCENTCLOUD_SECRET_KEY: ${TENCENTCLOUD_SECRET_KEY:-}
    volumes:
      - credentials:/run/oj-secrets:ro
      - judge-data:/home/judge/data
      - uploads:/home/judge/src/web/upload
      - nginx-state:/var/lib/oj-nginx
    tmpfs:
      - /tmp/hustoj_page_cache:size=256m,mode=1777
    ports:
      - "${WEB_BIND:-127.0.0.1}:${WEB_PORT:-8080}:80"
    healthcheck:
      test: ["CMD", "php", "/opt/oj/healthcheck.php"]
      interval: 15s
      timeout: 5s
      retries: 10
  judge:
    <<: *common
    build: {context: ., dockerfile: docker/judge/Dockerfile}
    image: ${COMPOSE_PROJECT_NAME:-hnieoj-unified}-judge:local
    depends_on:
      db: {condition: service_healthy}
    environment:
      OJ_DOCKER_RUNTIME_VOLUME: ${COMPOSE_PROJECT_NAME:-hnieoj-unified}-judge-runtime
      OJ_DOCKER_DATA_VOLUME: ${COMPOSE_PROJECT_NAME:-hnieoj-unified}-judge-data
      OJ_DOCKER_NETWORK: ${COMPOSE_PROJECT_NAME:-hnieoj-unified}-default
      OJ_DOCKER_IMAGE: ${COMPOSE_PROJECT_NAME:-hnieoj-unified}-judge:local
    volumes:
      - credentials:/run/oj-secrets:ro
      - judge-runtime:/home/judge
      - judge-data:/home/judge/data:ro
      - /var/run/docker.sock:/var/run/docker.sock
    healthcheck:
      test: ["CMD", "pgrep", "-x", "judged"]
      interval: 10s
      timeout: 5s
      retries: 10
volumes:
  db-data:
  credentials:
  uploads:
  nginx-state:
  judge-runtime:
    name: ${COMPOSE_PROJECT_NAME:-hnieoj-unified}-judge-runtime
  judge-data:
    name: ${COMPOSE_PROJECT_NAME:-hnieoj-unified}-judge-data
networks:
  default:
    name: ${COMPOSE_PROJECT_NAME:-hnieoj-unified}-default
