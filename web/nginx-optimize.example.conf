# ============================================================
# HNIEOJ Nginx 性能优化配置片段（示例）
# 仅包含性能相关项（gzip / 静态资源缓存 / 页面缓存规避）。
# 不含安全头、访问控制等规则。
#
# 用法：把以下内容合并到对应 server 块中（或 include 本文件），
# 然后执行 `nginx -t` 验证语法后 reload。
# ============================================================

# ---------- gzip 压缩 ----------
gzip on;
gzip_comp_level 5;
gzip_min_length 1024;
gzip_types text/plain text/css application/json application/javascript text/javascript application/xml image/svg+xml font/woff font/woff2;
gzip_vary on;
gzip_disable "msie6";
gzip_static on;   # 若使用预压缩静态资源（gzip -k）
# 开启 HTTP/2（需 listen 443 ssl http2; 或 listen 80 http2 需 Nginx>=1.25.1）
# listen 443 ssl http2;

# ---------- 静态资源长缓存（文件带版本号/内容变化时由文件名区分） ----------
location ~* \.(css|js|woff|woff2|ttf|eot|svg|png|jpg|jpeg|gif|ico)$ {
    expires 7d;
    add_header Cache-Control "public";
    access_log off;
    try_files $uri =404;
}

# ---------- 大体积前端库目录：更长缓存 + 关闭访问日志 ----------
location ~* ^/(ace|blockly|edit_area|kindeditor|highlight|bootstrap)/ {
    expires 30d;
    add_header Cache-Control "public";
    access_log off;
    try_files $uri =404;
}

# ---------- PHP 动态页面：禁止缓存 ----------
location ~ \.php$ {
    expires -1;
    add_header Cache-Control "no-store, no-cache, must-revalidate, max-age=0";
    # 下面按现有站点配置保留 fastcgi 相关指令
    # fastcgi_pass unix:/run/php/php7.3-fpm.sock;
    # fastcgi_param SCRIPT_FILENAME $document_root$fastcgi_script_name;
    # include fastcgi_params;
}