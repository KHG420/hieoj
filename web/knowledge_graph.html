<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>C语言程序设计知识图谱</title>
<script src="https://d3js.org/d3.v7.min.js" onerror="document.getElementById('cdn-warning').classList.add('show')"></script>
<style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    html, body { height: 100%; }
    body {
        font-family: "Segoe UI", "PingFang SC", "Microsoft YaHei", "Helvetica Neue", Arial, sans-serif;
        background: #f3f5f9;
        color: #1f2937;
        -webkit-font-smoothing: antialiased;
    }
    .app { max-width: 1520px; margin: 0 auto; padding: 24px 20px 36px; }
    #cdn-warning { display: none; background: #fef2f2; border: 1px solid #fecaca; color: #b91c1c; padding: 10px 16px; border-radius: 12px; margin-bottom: 12px; font-size: 13px; }
    #cdn-warning.show { display: block; }
    header { margin-bottom: 16px; }
    .title-row { display: flex; align-items: flex-end; justify-content: space-between; flex-wrap: wrap; gap: 14px; }
    h1 { font-size: 26px; font-weight: 700; letter-spacing: .2px; }
    .subtitle { margin-top: 6px; color: #6b7280; font-size: 14px; }
    .stats { display: flex; gap: 8px; flex-wrap: wrap; }
    .stat { background: #fff; border: 1px solid #e5e7eb; border-radius: 999px; padding: 6px 14px; font-size: 13px; color: #4b5563; }
    .stat b { color: #111827; }
    .card { background: #fff; border: 1px solid #eef0f4; border-radius: 16px; box-shadow: 0 1px 2px rgba(16,24,40,.04), 0 4px 14px rgba(16,24,40,.04); }
    .toolbar { display: flex; flex-wrap: wrap; align-items: center; gap: 10px; padding: 12px 14px; margin-bottom: 12px; }
    .search-wrap { position: relative; }
    .search-wrap .icon { position: absolute; left: 11px; top: 50%; transform: translateY(-50%); color: #9ca3af; display: flex; pointer-events: none; }
    .search-wrap input {
        width: 250px; padding: 9px 12px 9px 34px; border: 1px solid #e5e7eb; border-radius: 10px;
        background: #f9fafb; font-size: 13px; color: #1f2937; outline: none;
        transition: border-color .15s, box-shadow .15s, background .15s;
    }
    .search-wrap input:focus { border-color: #2563eb; background: #fff; box-shadow: 0 0 0 3px rgba(37,99,235,.12); }
    .search-wrap input::placeholder { color: #9ca3af; }
    .btn {
        display: inline-flex; align-items: center; gap: 6px; padding: 9px 14px;
        border: 1px solid #e5e7eb; background: #fff; border-radius: 10px; font-size: 13px;
        color: #374151; cursor: pointer; user-select: none;
        transition: background .15s, border-color .15s, color .15s;
    }
    .btn:hover { background: #f9fafb; border-color: #d1d5db; }
    .btn.active { background: #eff6ff; border-color: #2563eb; color: #2563eb; }
    .btn.primary { background: #2563eb; border-color: #2563eb; color: #fff; }
    .btn.primary:hover { background: #1d4ed8; }
    .spacer { flex: 1; }
    .filters { display: flex; flex-wrap: wrap; gap: 8px; margin-bottom: 12px; }
    .chip {
        display: inline-flex; align-items: center; gap: 7px; padding: 6px 13px;
        border: 1px solid #e5e7eb; background: #fff; border-radius: 999px;
        font-size: 13px; color: #4b5563; cursor: pointer; user-select: none;
        transition: border-color .15s, background .15s;
    }
    .chip:hover { border-color: #cbd5e1; }
    .chip.active { color: #111827; font-weight: 500; }
    .chip .dot { width: 10px; height: 10px; border-radius: 50%; flex: none; }
    .chip .count { color: #9ca3af; font-size: 12px; font-variant-numeric: tabular-nums; }
    .workspace { display: flex; gap: 14px; align-items: stretch; }
    #graph-container {
        position: relative; flex: 1; height: min(74vh, 840px); min-height: 540px; overflow: hidden;
        background: #fff; border: 1px solid #eef0f4; border-radius: 16px;
        box-shadow: 0 1px 2px rgba(16,24,40,.04), 0 4px 14px rgba(16,24,40,.04);
    }
    #graph-container svg { display: block; }
    .node { cursor: pointer; }
    .node circle { stroke: #fff; stroke-width: 2px; }
    .node text.nlabel { font-size: 12px; fill: #374151; text-anchor: middle; paint-order: stroke; stroke: #fff; stroke-width: 3px; stroke-linejoin: round; pointer-events: none; transition: opacity .15s; }
    .node.hl circle { stroke-width: 3px; stroke: #2563eb; filter: drop-shadow(0 0 6px rgba(37,99,235,.5)); }
    .node.selected circle { stroke-width: 3px; stroke: #111827; filter: drop-shadow(0 0 7px rgba(37,99,235,.6)); }
    .link { fill: none; stroke-linecap: round; }
    .tooltip {
        position: absolute; z-index: 30; max-width: 280px; background: rgba(17,24,39,.94); color: #f9fafb;
        padding: 7px 11px; border-radius: 9px; font-size: 12px; line-height: 1.5; pointer-events: none;
        display: none; box-shadow: 0 6px 18px rgba(16,24,40,.18);
    }
    .tooltip .tt-title { font-weight: 600; }
    .tooltip .tt-sub { font-size: 11px; color: #cbd5e1; margin-top: 1px; }
    .status {
        position: absolute; left: 14px; bottom: 12px; background: rgba(255,255,255,.94);
        border: 1px solid #eef0f4; border-radius: 999px; padding: 5px 12px; font-size: 12px;
        color: #4b5563; box-shadow: 0 2px 8px rgba(16,24,40,.06); display: none;
    }
    .edge-legend {
        position: absolute; right: 14px; bottom: 12px; background: rgba(255,255,255,.94);
        border: 1px solid #eef0f4; border-radius: 12px; padding: 9px 12px; font-size: 12px;
        color: #4b5563; box-shadow: 0 2px 8px rgba(16,24,40,.06);
        display: flex; flex-direction: column; gap: 6px;
    }
    .edge-legend .el { display: flex; align-items: center; gap: 8px; }
    .edge-legend .line { width: 26px; border-top: 2px solid; }
    .detail-panel { width: 318px; padding: 18px 18px 14px; overflow-y: auto; display: flex; flex-direction: column; gap: 14px; }
    .dp-empty { color: #9ca3af; font-size: 13px; text-align: center; line-height: 2; padding: 40px 10px; }
    .dp-cat { display: inline-flex; align-items: center; padding: 3px 10px; border-radius: 999px; font-size: 12px; color: #fff; font-weight: 500; }
    .dp-title { font-size: 19px; font-weight: 700; margin-top: 10px; }
    .dp-desc { font-size: 13px; color: #6b7280; line-height: 1.7; }
    .dp-stats { display: flex; gap: 8px; }
    .dp-stat { flex: 1; background: #f8fafc; border: 1px solid #eef0f4; border-radius: 10px; padding: 8px 6px; text-align: center; }
    .dp-stat .v { font-size: 16px; font-weight: 700; color: #111827; }
    .dp-stat .k { font-size: 11px; color: #9ca3af; margin-top: 2px; }
    .rel-group h4 { font-size: 12px; color: #6b7280; font-weight: 600; margin: 12px 0 6px; }
    .rel-item { display: flex; align-items: center; gap: 8px; padding: 6px 8px; border-radius: 8px; cursor: pointer; font-size: 13px; color: #374151; }
    .rel-item:hover { background: #f8fafc; }
    .rel-item .rdot { width: 9px; height: 9px; border-radius: 50%; flex: none; }
    .rel-item .rname { flex: 1; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
    .badge { font-size: 11px; padding: 2px 7px; border-radius: 999px; white-space: nowrap; }
    .badge.pre { background: #fef3c7; color: #b45309; }
    .badge.strong { background: #ffedd5; color: #c2410c; }
    .badge.rel { background: #f3f4f6; color: #6b7280; }
    footer { margin-top: 16px; text-align: center; color: #9ca3af; font-size: 12px; }
    @media (max-width: 980px) {
        .workspace { flex-direction: column; }
        #graph-container { height: 62vh; min-height: 430px; }
        .detail-panel {
            position: fixed; left: 12px; right: 12px; bottom: 12px; width: auto; max-height: 44vh;
            z-index: 50; box-shadow: 0 -4px 30px rgba(16,24,40,.16);
            transform: translateY(135%); transition: transform .25s ease;
        }
        .detail-panel.open { transform: translateY(0); }
        .search-wrap { flex: 1 1 100%; }
        .search-wrap input { width: 100%; }
    }
</style></head>
<body>
<div class="app">
    <div id="cdn-warning">D3.js 库加载失败，请检查网络后刷新页面。</div>

    <header>
        <div class="title-row">
            <div>
                <h1>C语言程序设计知识图谱</h1>
                <p class="subtitle">C 语言核心知识点及其关联的可视化导航 —— 悬停高亮关联，点击查看详情，拖动节点整理布局。</p>
            </div>
            <div class="stats">
                <span class="stat"><b id="stat-nodes">-</b> 个知识点</span>
                <span class="stat"><b id="stat-links">-</b> 条关联</span>
                <span class="stat"><b id="stat-cats">-</b> 个类别</span>
            </div>
        </div>
    </header>

    <div class="toolbar card">
        <div class="search-wrap">
            <span class="icon"><svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round"><circle cx="11" cy="11" r="7"/><path d="M21 21l-4.3-4.3"/></svg></span>
            <input id="searchInput" type="text" placeholder="搜索知识点名称或描述..." autocomplete="off">
        </div>
        <button id="btnFocus" class="btn" title="点击节点后仅显示其 2 跳内关联">聚焦模式</button>
        <button id="btnPhysics" class="btn" title="暂停/恢复节点自动布局">暂停物理</button>
        <button id="btnCenter" class="btn" title="将整图居中显示">居中视图</button>
        <button id="btnReset" class="btn" title="恢复初始布局与设置">重置视图</button>
        <div class="spacer"></div>
        <button id="btnExport" class="btn primary" title="将当前视图导出为 PNG 图片">导出 PNG</button>
    </div>

    <div class="filters" id="filters"></div>

    <div class="workspace">
        <div id="graph-container">
            <div class="tooltip" id="tooltip"><div class="tt-title"></div><div class="tt-sub"></div></div>
            <div class="status" id="status"></div>
            <div class="edge-legend">
                <div class="el"><span class="line" style="border-top-style: dashed; border-color: #94a3b8"></span>前置知识</div>
                <div class="el"><span class="line" style="border-top-color: #f59e0b; border-top-width: 3px"></span>强关联</div>
                <div class="el"><span class="line" style="border-top-color: #cbd5e1"></span>相关</div>
            </div>
        </div>

        <aside class="detail-panel card" id="detail-panel">
            <div class="dp-empty" id="dp-empty">点击图中任意节点<br>查看知识点详情</div>
            <div id="dp-body" style="display: none">
                <div class="dp-head">
                    <span class="dp-cat" id="dp-cat">-</span>
                    <div class="dp-title" id="dp-title">-</div>
                </div>
                <p class="dp-desc" id="dp-desc"></p>
                <div class="dp-stats">
                    <div class="dp-stat"><div class="v" id="stat-degree">-</div><div class="k">关联数</div></div>
                    <div class="dp-stat"><div class="v" id="stat-in">-</div><div class="k">入度</div></div>
                    <div class="dp-stat"><div class="v" id="stat-out">-</div><div class="k">出度</div></div>
                </div>
                <div id="rel-groups"></div>
            </div>
        </aside>
    </div>

    <footer>C语言程序设计知识图谱 · 节点关系图可视化</footer>
</div>

        { source: "preprocessor", target: "file-io", type: REL },
        { source: "preprocessor", target: "complex-data", type: REL },
        { source: "file-io", target: "complex-data", type: REL },
        { source: "preprocessor", target: "compile-link", type: PRE },
        { source: "compile-link", target: "multi-file", type: PRE },
        { source: "complex-data", target: "multi-file", type: REL },

        // 应用实践
        { source: "practice", target: "algorithms", type: PRE },
        { source: "practice", target: "projects", type: PRE },
        { source: "practice", target: "optimization", type: PRE },
        { source: "practice", target: "debugging", type: PRE },
        { source: "algorithms", target: "projects", type: REL },
        { source: "algorithms", target: "optimization", type: REL },
        { source: "projects", target: "optimization", type: REL },
        { source: "algorithms", target: "sorting", type: PRE },
        { source: "algorithms", target: "search", type: PRE },
        { source: "projects", target: "debugging", type: REL },
        { source: "optimization", target: "debugging", type: REL },

        // 跨类别
        { source: "basic", target: "data-types", type: PRE },
        { source: "basic", target: "control", type: PRE },
        { source: "data-types", target: "functions", type: PRE },
        { source: "control", target: "functions", type: PRE },
        { source: "data-types", target: "array-pointer", type: STRONG },
        { source: "functions", target: "array-pointer", type: PRE },
        { source: "array-pointer", target: "advanced", type: PRE },
        { source: "functions", target: "advanced", type: PRE },
        { source: "advanced", target: "practice", type: PRE },
        { source: "array-pointer", target: "practice", type: PRE },
        { source: "program-structure", target: "main-args", type: PRE },
        { source: "io", target: "main-args", type: REL },
        { source: "io", target: "file-io", type: PRE },
        { source: "scope", target: "typedef-storage", type: PRE },
        { source: "loop", target: "arrays", type: PRE },
        { source: "arrays", target: "sorting", type: PRE },
        { source: "recursion", target: "algorithms", type: PRE },
        { source: "linked-list", target: "complex-data", type: PRE },
        { source: "file-io", target: "projects", type: PRE },
        { source: "multi-file", target: "projects", type: PRE },
        { source: "memory-layout", target: "optimization", type: REL },
        { source: "bit-operations", target: "optimization", type: PRE },
        { source: "strings", target: "file-io", type: REL },
        { source: "search", target: "optimization", type: REL }
    ];

    // 数据完整性自检
    (function validate() {
        var ids = new Set(nodes.map(function (n) { return n.id; }));
        if (ids.size !== nodes.length) console.warn("[KG] 存在重复的节点 id");
        links.forEach(function (l) {
            if (!ids.has(l.source) || !ids.has(l.target)) console.warn("[KG] 边引用了不存在的节点:", l.source, l.target);
        });
    })();

    var degree = new Map();
    nodes.forEach(function (n) { degree.set(n.id, 0); });
    links.forEach(function (l) {
        degree.set(l.source, degree.get(l.source) + 1);
        degree.set(l.target, degree.get(l.target) + 1);
    });
    function nodeRadius(d) { return Math.min(26, 9 + Math.sqrt(degree.get(d.id)) * 3); }

    var state = {
        search: "",
        lastCenteredSearch: "",
        focus: null,
        hover: null,
        selected: null,
        focusModeOn: false,
        physicsOn: true,
        activeCats: new Set(CATEGORIES.map(function (_, i) { return i; }))
    };
    var container = document.getElementById("graph-container");
    var searchInput = document.getElementById("searchInput");
    var tooltipEl = document.getElementById("tooltip");
    var statusEl = document.getElementById("status");
    var width = container.clientWidth || 900;
    var height = container.clientHeight || 600;
    var svg, g, linkSel, nodeSel, sim, zoom, currentK = 1;

    // ---------- 图形初始化 ----------
    function initGraph() {
        container.querySelectorAll("svg").forEach(function (s) { s.remove(); });
        svg = d3.select(container).append("svg").attr("width", width).attr("height", height);
        var defs = svg.append("defs");

        var pat = defs.append("pattern").attr("id", "grid").attr("width", 26).attr("height", 26).attr("patternUnits", "userSpaceOnUse");
        pat.append("path").attr("d", "M 26 0 L 0 0 0 26").attr("fill", "none").attr("stroke", "#f1f4f9").attr("stroke-width", 1);
        svg.append("rect").attr("width", width).attr("height", height).attr("fill", "url(#grid)");

        defs.append("marker").attr("id", "arrow")
            .attr("viewBox", "0 -5 10 10").attr("refX", 26).attr("refY", 0)
            .attr("markerWidth", 6.5).attr("markerHeight", 6.5).attr("orient", "auto")
            .append("path").attr("d", "M0,-4.5L10,0L0,4.5").attr("fill", "#94a3b8");

        zoom = d3.zoom().scaleExtent([0.25, 4]).on("zoom", function (e) {
            g.attr("transform", e.transform);
            currentK = e.transform.k;
            refreshLabelVisibility();
        });
        svg.call(zoom);
        g = svg.append("g");

        var cx = width / 2, cy = height / 2;
        var R = Math.min(width, height) * 0.33;
        function angle(i) { return i / CATEGORIES.length * Math.PI * 2 - Math.PI / 2; }
        function clusterX(d) { return cx + R * Math.cos(angle(d.category)); }
        function clusterY(d) { return cy + R * Math.sin(angle(d.category)); }

        sim = d3.forceSimulation(nodes)
            .force("link", d3.forceLink(links).id(function (d) { return d.id; })
                .distance(function (l) { return l.type === STRONG ? 70 : 96; }).strength(0.55))
            .force("charge", d3.forceManyBody().strength(-250))
            .force("x", d3.forceX(clusterX).strength(0.24))
            .force("y", d3.forceY(clusterY).strength(0.24))
            .force("collision", d3.forceCollide().radius(function (d) { return nodeRadius(d) + 7; }))
            .force("center", d3.forceCenter(cx, cy));

        linkSel = g.append("g").attr("class", "links").selectAll("line").data(links).enter().append("line")
            .attr("class", "link")
            .attr("stroke", function (d) { return LINK_STYLES[d.type].color; })
            .attr("stroke-width", function (d) { return LINK_STYLES[d.type].width; })
            .attr("stroke-dasharray", function (d) { return LINK_STYLES[d.type].dash || null; })
            .attr("marker-end", function (d) { return d.type === PRE ? "url(#arrow)" : null; })
            .on("mouseenter", function (e, d) { showTooltip(e, d.source.name + " → " + d.target.name, d.type); })
            .on("mousemove", moveTooltip)
            .on("mouseleave", hideTooltip);

        nodeSel = g.append("g").attr("class", "nodes").selectAll("g.node").data(nodes).enter().append("g")
            .attr("class", "node")
            .call(d3.drag()
                .on("start", function (e, d) {
                    if (!e.active) sim.alphaTarget(0.25).restart();
                    d.fx = d.x; d.fy = d.y;
                })
                .on("drag", function (e, d) { d.fx = e.x; d.fy = e.y; })
                .on("end", function () { /* 拖拽后保持固定位置 */ })
            );

        nodeSel.append("circle")
            .attr("r", nodeRadius)
            .attr("fill", function (d) { return CATEGORIES[d.category].color; })
            .on("mouseenter", function (e, d) {
                state.hover = d.id;
                showTooltip(e, d.name, CATEGORIES[d.category].name);
                applyView();
            })
            .on("mousemove", moveTooltip)
            .on("mouseleave", function () {
                state.hover = null;
                hideTooltip();
                applyView();
            })
            .on("click", function (e, d) { e.stopPropagation(); selectNode(d); });

        nodeSel.append("text")
            .attr("dy", function (d) { return nodeRadius(d) + 13; })
            .attr("class", "nlabel")
            .attr("font-family", "Segoe UI, PingFang SC, Microsoft YaHei, sans-serif")
            .text(function (d) { return d.name; });

        sim.on("tick", function () {
            linkSel
                .attr("x1", function (d) { return d.source.x; }).attr("y1", function (d) { return d.source.y; })
                .attr("x2", function (d) { return d.target.x; }).attr("y2", function (d) { return d.target.y; });
            nodeSel.attr("transform", function (d) { return "translate(" + d.x + "," + d.y + ")"; });
        });

        svg.on("click", function () {
            state.selected = null;
            if (state.focusModeOn && state.focus) state.focus = null;
            renderPanel(null);
            applyView();
        });
    }
    // ---------- 视图状态 ----------
    var neighborCache = new Map();
    function neighborsOf(id) {
        if (!neighborCache.has(id)) {
            var s = new Set();
            links.forEach(function (l) {
                if (l.source.id === id) s.add(l.target.id);
                if (l.target.id === id) s.add(l.source.id);
            });
            neighborCache.set(id, s);
        }
        return neighborCache.get(id);
    }
    function focusSet(id) {
        var s = new Set([id]);
        var frontier = [id];
        for (var depth = 0; depth < 2; depth++) {
            var next = [];
            frontier.forEach(function (f) {
                neighborsOf(f).forEach(function (n) { if (!s.has(n)) { s.add(n); next.push(n); } });
            });
            frontier = next;
        }
        return s;
    }
    function computeMatches() {
        var term = state.search;
        var set = new Set();
        if (term) {
            nodes.forEach(function (n) {
                if ((n.name + " " + n.description).toLowerCase().indexOf(term) !== -1) set.add(n.id);
            });
        }
        return set;
    }
    function applyView() {
        var matches = computeMatches();
        var fs = state.focus ? focusSet(state.focus) : null;
        var hover = state.hover;
        var hoverN = hover ? neighborsOf(hover) : null;

        function nodeOp(d) {
            if (!state.activeCats.has(d.category)) return 0;
            if (state.search) return matches.has(d.id) ? 1 : 0.12;
            if (fs) return fs.has(d.id) ? 1 : 0.07;
            if (hover) return (d.id === hover || hoverN.has(d.id)) ? 1 : 0.15;
            return 1;
        }
        nodeSel.attr("opacity", function (d) { return nodeOp(d); });
        nodeSel.attr("pointer-events", function (d) { return nodeOp(d) >= 0.5 ? null : "none"; });
        nodeSel.classed("hl", function (d) { return (state.search && matches.has(d.id)) || d.id === state.selected; });
        nodeSel.classed("selected", function (d) { return d.id === state.selected; });

        function linkOp(d) {
            var si = d.source.id, ti = d.target.id;
            if (!state.activeCats.has(d.source.category) || !state.activeCats.has(d.target.category)) return 0;
            if (state.search) return (matches.has(si) && matches.has(ti)) ? 1 : ((matches.has(si) || matches.has(ti)) ? 0.25 : 0.05);
            if (fs) return (fs.has(si) && fs.has(ti)) ? 1 : 0.05;
            if (hover) return ((si === hover && hoverN.has(ti)) || (ti === hover && hoverN.has(si))) ? 1 : 0.08;
            return 1;
        }
        linkSel.attr("opacity", function (d) { return linkOp(d); });
        linkSel.attr("pointer-events", function (d) { return linkOp(d) >= 0.5 ? null : "none"; });
        refreshLabelVisibility();
    }
    function refreshLabelVisibility() {
        var show = currentK >= 0.55;
        nodeSel.select("text.nlabel").attr("opacity", function () {
            var p = parseFloat(this.parentNode.getAttribute("opacity") || 1);
            return (show && p >= 0.9) ? 1 : 0;
        });
    }

    // ---------- 交互 ----------
    function selectNode(d) {
        state.selected = d.id;
        if (state.focusModeOn) {
            state.focus = d.id;
            setStatus("聚焦模式：仅显示「" + d.name + "」2 跳内的关联（再次点击节点或空白处退出）");
        }
        renderPanel(d);
        document.getElementById("detail-panel").classList.add("open");
        applyView();
        var t = d3.zoomTransform(svg.node());
        var sx = d.x * t.k + t.x, sy = d.y * t.k + t.y;
        if (sx < 60 || sx > width - 60 || sy < 60 || sy > height - 60) centerNode(d);
    }
    function centerNode(d) {
        var t = d3.zoomTransform(svg.node());
        var x = -d.x * t.k + width / 2;
        var y = -d.y * t.k + height / 2;
        svg.transition().duration(dur(650)).call(zoom.transform, d3.zoomIdentity.translate(x, y).scale(t.k));
    }

    function showTooltip(e, title, sub) {
        tooltipEl.querySelector(".tt-title").textContent = title;
        tooltipEl.querySelector(".tt-sub").textContent = sub || "";
        tooltipEl.style.display = "block";
        moveTooltip(e);
    }
    function moveTooltip(e) {
        var r = container.getBoundingClientRect();
        var x = e.clientX - r.left + 14;
        var y = e.clientY - r.top + 16;
        tooltipEl.style.left = Math.min(x, Math.max(0, width - 180)) + "px";
        tooltipEl.style.top = Math.min(y, Math.max(0, height - 70)) + "px";
    }
    function hideTooltip() { tooltipEl.style.display = "none"; }
    function setStatus(text) {
        if (text) { statusEl.textContent = text; statusEl.style.display = "block"; }
        else { statusEl.style.display = "none"; }
    }
    // ---------- 详情面板 ----------
    function renderPanel(d) {
        var panel = document.getElementById("detail-panel");
        var empty = document.getElementById("dp-empty");
        var body = document.getElementById("dp-body");
        if (!d) {
            empty.style.display = "block";
            body.style.display = "none";
            panel.classList.remove("open");
            return;
        }
        empty.style.display = "none";
        body.style.display = "block";
        var cat = CATEGORIES[d.category];
        var catEl = document.getElementById("dp-cat");
        catEl.textContent = cat.name;
        catEl.style.background = cat.color;
        document.getElementById("dp-title").textContent = d.name;
        document.getElementById("dp-desc").textContent = d.description;
        document.getElementById("stat-degree").textContent = degree.get(d.id);
        var indeg = 0, outdeg = 0;
        links.forEach(function (l) {
            if (l.target.id === d.id) indeg++;
            if (l.source.id === d.id) outdeg++;
        });
        document.getElementById("stat-in").textContent = indeg;
        document.getElementById("stat-out").textContent = outdeg;

        var preIn = [], preOut = [], strong = [], rel = [];
        links.forEach(function (l) {
            var other = null;
            if (l.source.id === d.id) other = l.target;
            else if (l.target.id === d.id) other = l.source;
            else return;
            if (l.type === PRE) {
                if (l.source.id === d.id) preOut.push(other); else preIn.push(other);
            } else if (l.type === STRONG) strong.push(other);
            else rel.push(other);
        });

        var groupsEl = document.getElementById("rel-groups");
        groupsEl.innerHTML = "";
        function mkGroup(title, items, badgeCls, badgeText) {
            if (!items.length) return;
            var h = document.createElement("div");
            h.className = "rel-group";
            var head = document.createElement("h4");
            head.appendChild(document.createTextNode(title));
            h.appendChild(head);
            items.forEach(function (it) {
                var row = document.createElement("div");
                row.className = "rel-item";
                var dot = document.createElement("span");
                dot.className = "rdot";
                dot.style.background = CATEGORIES[it.category].color;
                var name = document.createElement("span");
                name.className = "rname";
                name.textContent = it.name;
                var badge = document.createElement("span");
                badge.className = "badge " + badgeCls;
                badge.textContent = badgeText;
                row.appendChild(dot); row.appendChild(name); row.appendChild(badge);
                row.addEventListener("click", function () { selectNode(it); });
                h.appendChild(row);
            });
            groupsEl.appendChild(h);
        }
        mkGroup("先修知识（学习前需掌握）", preIn, "pre", "前置");
        mkGroup("支撑以下知识点", preOut, "pre", "前置");
        mkGroup("强关联", strong, "strong", "强关联");
        mkGroup("相关知识点", rel, "rel", "相关");
    }

    // ---------- 分类筛选 ----------
    function buildChips() {
        var wrap = document.getElementById("filters");
        wrap.innerHTML = "";
        var all = document.createElement("button");
        all.className = "chip";
        all.dataset.cat = "-1";
        all.innerHTML = '<span class="dot" style="background:conic-gradient(#7c6bd6,#5b8def,#2fa8a0,#ef9f3f,#e0659a,#5cb06a,#ef7a55,#7c6bd6)"></span><span>全部</span><span class="count">' + nodes.length + '</span>';
        all.addEventListener("click", function () {
            state.activeCats = new Set(CATEGORIES.map(function (_, i) { return i; }));
            updateChipStates();
            applyView();
        });
        wrap.appendChild(all);
        CATEGORIES.forEach(function (c, i) {
            var count = nodes.filter(function (n) { return n.category === i; }).length;
            var el = document.createElement("button");
            el.className = "chip";
            el.dataset.cat = String(i);
            el.innerHTML = '<span class="dot" style="background:' + c.color + '"></span><span>' + c.name + '</span><span class="count">' + count + '</span>';
            el.addEventListener("click", function () { toggleCat(i); });
            wrap.appendChild(el);
        });
        updateChipStates();
    }
    function toggleCat(i) {
        if (state.activeCats.size === 1 && state.activeCats.has(i)) return;
        if (state.activeCats.has(i)) state.activeCats.delete(i); else state.activeCats.add(i);
        updateChipStates();
        applyView();
    }
    function updateChipStates() {
        var chips = document.querySelectorAll("#filters .chip");
        chips.forEach(function (chip) {
            var cat = parseInt(chip.dataset.cat, 10);
            var active = cat === -1 ? state.activeCats.size === CATEGORIES.length : state.activeCats.has(cat);
            chip.classList.toggle("active", active);
            if (cat >= 0) {
                var c = CATEGORIES[cat];
                chip.style.borderColor = active ? c.color : "";
                chip.style.background = active ? c.color + "14" : "";
            } else {
                chip.style.borderColor = active ? "#2563eb" : "";
                chip.style.background = active ? "#eff6ff" : "";
            }
        });
    }
    // ---------- 控件与事件 ----------
    document.getElementById("stat-nodes").textContent = nodes.length;
    document.getElementById("stat-links").textContent = links.length;
    document.getElementById("stat-cats").textContent = CATEGORIES.length;

    searchInput.addEventListener("input", function () {
        state.search = searchInput.value.trim().toLowerCase();
        var matches = computeMatches();
        if (state.search && matches.size && state.search !== state.lastCenteredSearch) {
            state.lastCenteredSearch = state.search;
            var first = null;
            nodes.forEach(function (n) { if (!first && matches.has(n.id)) first = n; });
            if (first) centerNode(first);
        }
        setStatus(state.search ? "匹配 " + matches.size + " 个知识点" : "");
        applyView();
    });

    document.getElementById("btnFocus").addEventListener("click", function () {
        state.focusModeOn = !state.focusModeOn;
        this.classList.toggle("active", state.focusModeOn);
        if (state.focusModeOn) setStatus("聚焦模式：点击任意节点查看其 2 跳内关联");
        else { state.focus = null; setStatus(""); }
        applyView();
    });

    document.getElementById("btnPhysics").addEventListener("click", function () {
        state.physicsOn = !state.physicsOn;
        if (state.physicsOn) { sim.alphaTarget(0.25).restart(); this.textContent = "暂停物理"; }
        else { sim.stop(); this.textContent = "启动物理"; }
    });

    document.getElementById("btnCenter").addEventListener("click", function () {
        svg.transition().duration(dur(600)).call(zoom.transform, d3.zoomIdentity);
    });

    document.getElementById("btnReset").addEventListener("click", function () {
        searchInput.value = "";
        state.search = "";
        state.lastCenteredSearch = "";
        state.focus = null;
        state.hover = null;
        state.selected = null;
        state.focusModeOn = false;
        state.physicsOn = true;
        state.activeCats = new Set(CATEGORIES.map(function (_, i) { return i; }));
        document.getElementById("btnFocus").classList.remove("active");
        document.getElementById("btnPhysics").textContent = "暂停物理";
        setStatus("");
        hideTooltip();
        renderPanel(null);
        updateChipStates();
        initGraph();
    });

    function exportPNG() {
        try {
            var clone = svg.node().cloneNode(true);
            clone.setAttribute("xmlns", "http://www.w3.org/2000/svg");
            var xml = new XMLSerializer().serializeToString(clone);
            var blob = new Blob([xml], { type: "image/svg+xml;charset=utf-8" });
            var url = URL.createObjectURL(blob);
            var img = new Image();
            img.onload = function () {
                var canvas = document.createElement("canvas");
                var scale = 2;
                canvas.width = width * scale;
                canvas.height = height * scale;
                var ctx = canvas.getContext("2d");
                ctx.fillStyle = "#ffffff";
                ctx.fillRect(0, 0, canvas.width, canvas.height);
                ctx.drawImage(img, 0, 0, canvas.width, canvas.height);
                URL.revokeObjectURL(url);
                var a = document.createElement("a");
                a.download = "C语言知识图谱.png";
                a.href = canvas.toDataURL("image/png");
                a.click();
            };
            img.onerror = function () { URL.revokeObjectURL(url); setStatus("导出失败：无法解析当前视图"); };
            img.src = url;
        } catch (err) {
            setStatus("导出失败：" + err.message);
        }
    }
    document.getElementById("btnExport").addEventListener("click", exportPNG);

    if (window.ResizeObserver) {
        new ResizeObserver(function () {
            var w = container.clientWidth, h = container.clientHeight;
            if (!w || !h) return;
            width = w; height = h;
            if (svg) {
                svg.attr("width", w).attr("height", h);
                svg.select("rect").attr("width", w).attr("height", h);
                sim.force("center", d3.forceCenter(w / 2, h / 2));
                sim.alpha(0.3).restart();
            }
        }).observe(container);
    }

    // ---------- 启动 ----------
    if (typeof d3 === "undefined") {
        document.getElementById("cdn-warning").classList.add("show");
        return;
    }
    buildChips();
    initGraph();
    renderPanel(null);
})();
</script>
</body>
