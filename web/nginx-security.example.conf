# ============================================================
# HNIEOJ Nginx 安全加固配置片段（示例）
# 仅包含安全相关项（隐藏敏感文件、限制上传目录执行、安全响应头）。
# 用法：合并到对应 server 块中（或 include 本文件），nginx -t 验证后 reload。
# ============================================================

# 隐藏 Nginx 版本号
server_tokens off;

# ---------- 拒绝访问敏感路径 ----------
# 仓库 .git 目录若随站点部署，将泄露全部历史代码与配置
location ~ /\.(git|svn|hg) {
    deny all;
    return 404;
}
# 旧模板备份、备份文件、日志
location ~ ^/(template_backup|backup)/ {
    deny all;
    return 404;
}
location ~* \.(bak|old|mv|log|sql|md)$ {
    deny all;
    return 404;
}

# ---------- 上传目录禁止执行 PHP ----------
location ^~ /upload/ {
    location ~ \.php$ {
        deny all;
    }
}

# ---------- 安全响应头（PHP 端已输出 X-Frame-Options 等，此处双保险） ----------
add_header X-Frame-Options "SAMEORIGIN" always;
add_header X-Content-Type-Options "nosniff" always;
add_header Referrer-Policy "strict-origin-when-cross-origin" always;

# ---------- 限制请求体大小（防上传滥用） ----------
client_max_body_size 8m;

# ============================================================
# 部署提示：
# 1) 若服务器上仍保留 fileupload.php（临时上传工具），用完请删除；
# 2) 请尽快轮换 sendemail.php 与 lostpassword.php 中泄露的云/SMTP 凭据
#    （本次优化按约定未改动这些值）；
# 3) 建议将 aiapi/ 目录仅限校内网段访问：
#    location ^~ /aiapi/ { allow 10.0.0.0/8; allow 172.16.0.0/12; deny all; }
# ============================================================
