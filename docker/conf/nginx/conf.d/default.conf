server {
    listen 80 default_server;
    listen [::]:80 default_server;
    server_name _;
    root /home/judge/src/web;
    index index.php index.html index.htm;

    client_max_body_size 500m;

    # 静态资源长缓存 / 敏感路径拒绝 / 安全响应头（沿用现网 oj-hardening.conf）
    include /etc/nginx/snippets/oj-hardening.conf;

    # AI 爬虫拦截：命中官方网段($oj_bad_ip) 或 UA 特征($oj_bad_ua) 一律 444。
    # 444 不发响应体、不进 location 处理，比 403 省隧道带宽与本机资源。
    # IP 判据放前面：UA 可伪造，IP 段不能（爬虫实测占全站流量的 90%+）。
    if ($oj_bad_ip) { return 444; }
    if ($oj_bad_ua) { return 444; }
    if ($block_ip)  { return 444; }

    # 被 444 的爬虫请求不写日志（if= 条件开关）。
    # 不能用含变量的路径 —— nginx 会拼 prefix 导致日志丢失（见 00-oj-http.conf 注释）。
    access_log /var/log/nginx/access.log combined buffer=32k flush=5s if=$oj_keep_log;

    location / {
        try_files $uri $uri/ =404;
    }

    location ~ \.php$ {
        limit_req zone=oj_dyn burst=20 nodelay;
        include snippets/fastcgi-php.conf;
        fastcgi_pass unix:/run/php/php8.1-fpm.sock;
        fastcgi_buffer_size 256k;
        fastcgi_buffers 32 64k;
    }
}
