# ============================================================
# HNIEOJ 安全与性能加固片段（部署生成）
# 由 nginx-security.example.conf + nginx-optimize.example.conf 合并
# 2026-09-10 性能审计修订：
#   1) 修正完全失效的备份文件 deny 规则（原规则锚定行尾，漏掉 *.bak-<时间戳>）
#   2) 修正静态缓存规则顺序（目录级 30d 被扩展名 7d 抢先，从未生效）
#   3) 新增 gzip_static（静态资源预压缩）
# ============================================================
server_tokens off;

# ---------- gzip ----------
gzip on;
gzip_comp_level 5;
gzip_min_length 1024;
gzip_types text/plain text/css application/json application/javascript text/javascript application/xml image/svg+xml font/woff font/woff2;
gzip_vary on;
gzip_disable "msie6";
# 存在同名 .gz 时直接发送，省 CPU 并避免漏压（无 .gz 时自动回落动态 gzip）
gzip_static on;

# ---------- 蜜罐（2026-09-10）----------
# 下列路径真实访客不可能访问：
#   * robots.txt 里 Disallow —— 守规矩的爬虫会避开，所以命中者必然不守规矩
#   * 页面中以 display:none 隐藏 —— 浏览器不渲染，而解析 HTML 的爬虫会跟进去
# 因此「命中蜜罐」是确定性的爬虫判据（比枚举广度更硬）。
# 这里 444 断连并单独记入 honeypot.log，由 crawler-guard.sh 施加更长 TTL 的封禁。
# 注意：正则 location 是「先匹配先赢」，蜜罐必须排在其它规则之前。
location ~ ^/_oj_(trap|export|internal|debug)/ {
    access_log /var/log/nginx/honeypot.log combined;
    return 444;
}

# ---------- 敏感路径拒绝 ----------
location ~ /\.(git|svn|hg) { deny all; return 404; }
location ~ ^/(template_backup|backup)/ { deny all; return 404; }
# 备份文件实际命名形如 category.php.bak-2026-09-10-1954，后缀是时间戳而非 .bak，
# 原先的 \.(bak|old|...)$ 因锚定行尾而完全失效 —— 实测 15 个文件可公网下载 PHP 源码。
location ~* \.bak[^/]*$ { deny all; return 404; }
location ~* \.(old|orig|save|swp|tmp|mv|log|sql|md|conf|example)$ { deny all; return 404; }
location ~* \.ya?ml$ { deny all; return 404; }

# ---------- 上传目录禁止执行 PHP ----------
location ^~ /upload/ {
    location ~ \.php$ { deny all; }
}

# ---------- 静态资源长缓存 ----------
# 顺序很关键：nginx 正则 location 是「先匹配先赢」，
# 目录级 30d 规则必须排在扩展名 7d 规则之前，否则 ace.js 之类只能拿到 7d。
location ~* ^/(ace|blockly|edit_area|kindeditor|highlight|bootstrap)/ {
    expires 30d;
    add_header Cache-Control "public";
    access_log off;
    try_files $uri =404;
}
location ~* \.(css|js|woff|woff2|ttf|eot|svg|png|jpg|jpeg|gif|ico)$ {
    expires 7d;
    add_header Cache-Control "public";
    access_log off;
    try_files $uri =404;
}

# ---------- 安全响应头 ----------
add_header X-Frame-Options "SAMEORIGIN" always;
add_header X-Content-Type-Options "nosniff" always;
add_header Referrer-Policy "strict-origin-when-cross-origin" always;
